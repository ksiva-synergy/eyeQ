<style>
body{margin:0;background:#0B0B10;color:#F3F2F8;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#B197FC;text-decoration:none}a:hover{color:#D4C6FF}
.d{font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:700;line-height:.95;letter-spacing:-.01em}
.tn{font-variant-numeric:tabular-nums}
.cap{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8E8DA0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font:800 15px/1.2 Manrope,sans-serif;border:0;cursor:pointer;padding:0 20px;box-sizing:border-box;width:100%;text-decoration:none;color:#fff}
.pri{background:#7C3AED;color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:#1E1E28;border:1px solid #2A2A37;font-size:12px;font-weight:700;white-space:nowrap}
.badge{animation:badge 1.1s cubic-bezier(.34,1.56,.64,1) both}
@keyframes badge{0%{transform:scale(.3) rotate(-12deg);opacity:0}45%{transform:scale(1.12) rotate(2deg);opacity:1}70%{transform:scale(.96)}100%{transform:scale(1) rotate(0)}}
.rays{animation:rays 1.1s ease-out both;transform-origin:50% 50%}
@keyframes rays{0%{transform:scale(.2) rotate(0);opacity:0}40%{opacity:.6}100%{transform:scale(1.5) rotate(25deg);opacity:0}}
.ring{animation:ring 1.1s .1s ease-out both;transform-origin:50% 50%}
@keyframes ring{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.3);opacity:0}}
.t1,.t2,.t3{animation:up .45s cubic-bezier(.2,.9,.2,1) both}
.t1{animation-delay:.5s}.t2{animation-delay:.62s}.t3{animation-delay:.74s}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion: reduce){.badge,.rays,.ring,.t1,.t2,.t3{animation-duration:.01s !important;animation-delay:0s !important}}
</style>
</helmet>

    <svg class="rays" width="300" height="300" viewBox="0 0 100 100" aria-hidden="true" style="position:absolute;color:#B197FC"><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M50 2v18M50 80v18M2 50h18M80 50h18M16 16l13 13M71 71l13 13M16 84l13-13M71 29l13-13"></path></g></svg>

    <svg class="badge" width="176" height="192" viewBox="0 0 88 96" role="img" aria-label="Level 8 badge"><path d="M44 2l38 22v44L44 94 6 68V24z" fill="#7C3AED"></path><path d="M44 12l29 17v34L44 80 15 63V29z" fill="#15151D"></path><text x="44" y="63" text-anchor="middle" font-family="Barlow Condensed, Impact, sans-serif" font-weight="800" font-size="46" fill="#F3F2F8">8</text></svg>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
    <div class="t1 cap" style="color:#B197FC;font-size:13px">Level up</div>
    <div class="t2 d" style="font-size:64px;line-height:.9;font-weight:800">LEVEL 8<br><span style="color:#B197FC">PROSPECT</span></div>
    <div class="t3" style="font-size:14px;line-height:1.5;color:#D4C6FF;max-width:300px">2,112 XP. One more level and you're a <strong style="color:#F3F2F8">Contender</strong> — new drills unlock on the way.</div>
  </div>
  <div class="t3" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <span class="chip" style="background:#1E1E28;border-color:#34344A">Unlocked: Saccade Ladder II</span>
    <span class="chip" style="background:#2B2308;border-color:#5C4A0E;color:#FFD23F">+20 coins</span>
  </div>
  <div style="margin-top:auto;width:100%"><span class="btn pri">Continue</span></div>
</a>
