<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>EyeQ — Trophy case</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0B0B10;color:#F3F2F8;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#B197FC;text-decoration:none}a:hover{color:#D4C6FF}
.d{font-family:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;font-weight:700;line-height:.95;letter-spacing:-.01em}
.tn{font-variant-numeric:tabular-nums}
.cap{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8E8DA0}
.card{background:#15151D;border:1px solid #2A2A37;border-radius:20px;box-sizing:border-box}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid #2A2A37;background:#15151D;color:#F3F2F8;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;text-decoration:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:#1E1E28;border:1px solid #2A2A37;font-size:12px;font-weight:700;white-space:nowrap}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-height:44px;justify-content:center;font-size:11px;font-weight:700;color:#8E8DA0;text-decoration:none;position:relative}
.tab.on{color:#B197FC}.tab.on:before{content:"";position:absolute;top:-8px;width:24px;height:3px;border-radius:2px;background:#7C3AED}
.bd{border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:118px;box-sizing:border-box;border:1px solid #2A2A37;background:#15151D}
.bd.lock{border-style:dashed;background:transparent}
.bd .t{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;font-size:15px;line-height:1}
.bd .s{font-size:10px;line-height:1.3;color:#8E8DA0;font-weight:600}
.rk{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0B0B10;box-sizing:border-box">
  <div style="position:absolute;inset:0;overflow:auto;padding:56px 20px 110px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">

      <span class="chip tn" style="color:#FFD23F;border-color:#5C4A0E;background:#2B2308">7 / 24</span>
    </div>

    <div class="card" style="padding:14px 12px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px"><span style="font-size:14px;font-weight:800">Rank titles</span><span class="cap">by level</span></div>

        <div class="rk"><svg width="36" height="40" viewBox="0 0 88 96" aria-hidden="true"><path d="M44 2l38 22v44L44 94 6 68V24z" fill="#3A3A4A"></path><path d="M44 12l29 17v34L44 80 15 63V29z" fill="#1E1E28"></path><path d="M34 52l7 7 13-15" fill="none" stroke="#3DD68C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="d" style="font-size:14px;color:#A9A8B8">ROOKIE</span><span class="cap" style="font-size:9px">Lvl 1–3</span></div>
        <div class="rk"><svg width="44" height="48" viewBox="0 0 88 96" aria-hidden="true"><path d="M44 2l38 22v44L44 94 6 68V24z" fill="#7C3AED"></path><path d="M44 12l29 17v34L44 80 15 63V29z" fill="#241B3F"></path><text x="44" y="60" text-anchor="middle" font-family="Barlow Condensed, Impact, sans-serif" font-weight="800" font-size="40" fill="#F3F2F8">7</text></svg><span class="d" style="font-size:14px;color:#B197FC">PROSPECT</span><span class="cap" style="font-size:9px;color:#B197FC">Lvl 4–8 · you</span></div>
        <div class="rk"><svg width="36" height="40" viewBox="0 0 88 96" aria-hidden="true"><path d="M44 2l38 22v44L44 94 6 68V24z" fill="#2A2A37"></path><path d="M44 12l29 17v34L44 80 15 63V29z" fill="#15151D"></path><rect x="34" y="44" width="20" height="16" rx="3" fill="none" stroke="#5AB4FF" stroke-width="4"></rect><path d="M38 44v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#5AB4FF" stroke-width="4"></path></svg><span class="d" style="font-size:14px;color:#5AB4FF">CONTENDER</span><span class="cap" style="font-size:9px">Lvl 9–14</span></div>
        <div class="rk"><svg width="36" height="40" viewBox="0 0 88 96" aria-hidden="true"><path d="M44 2l38 22v44L44 94 6 68V24z" fill="#2A2A37"></path><path d="M44 12l29 17v34L44 80 15 63V29z" fill="#15151D"></path><rect x="34" y="44" width="20" height="16" rx="3" fill="none" stroke="#FF6B81" stroke-width="4"></rect><path d="M38 44v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#FF6B81" stroke-width="4"></path></svg><span class="d" style="font-size:14px;color:#FF6B81">ELITE</span><span class="cap" style="font-size:9px">Lvl 15–20</span></div>
        <div class="rk"><svg width="36" height="40" viewBox="0 0 88 96" aria-hidden="true"><path d="M44 2l38 22v44L44 94 6 68V24z" fill="#2A2A37"></path><path d="M44 12l29 17v34L44 80 15 63V29z" fill="#15151D"></path><rect x="34" y="44" width="20" height="16" rx="3" fill="none" stroke="#FFD23F" stroke-width="4"></rect><path d="M38 44v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#FFD23F" stroke-width="4"></path></svg><span class="d" style="font-size:14px;color:#FFD23F">PEAK</span><span class="cap" style="font-size:9px">Lvl 21+</span></div>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="cap">Badges</span><span class="cap" style="color:#A9A8B8">Tap a locked badge to see how</span></div>
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
      <sc-for list="{{badges}}" as="b" hint-placeholder-count="12">
        <div class="{{b.cls}}">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{b.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{b.aria}}"><path d="{{b.icon}}"></path></svg>
          <span class="t" style="color:{{b.tc}}">{{b.name}}</span>
          <span class="s">{{b.sub}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="position:absolute;left:0;right:0;bottom:0;height:84px;padding:12px 8px 24px;box-sizing:border-box;background:#0F0F15;border-top:1px solid #2A2A37;display:flex">
    <a class="tab" href="Home.dc.html"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a class="tab" href="Programs.dc.html"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M10 8l6 4-6 4z"></path></svg>Train</a>
    <a class="tab" href="Leaderboard.dc.html"><svg class="i" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"></path></svg>Compete</a>
    <a class="tab" href="Progress.dc.html"><svg class="i" viewBox="0 0 24 24"><path d="M4 20v-7M10 20V6M16 20v-10M22 20H2"></path></svg>Progress</a>
    <a class="tab on" href="Profile.dc.html"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>

    const flame = 'M12 3c.5 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2.5-4.5C9.5 12 11 13 12 13c-.5-3-1.5-6 0-10z';

    const scan = 'M4 16l5-6 4 4 7-9';

    const star = 'M12 2l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17l-6.1 3.5 1.5-6.8L2.2 9l6.9-.7z';
    const sun = 'M12 4v2M12 18v2M4 12h2M18 12h2M6 6l1.5 1.5M16.5 16.5L18 18M6 18l1.5-1.5M16.5 7.5L18 6M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z';
    const list = [
      ['First Rep', 'First session done', true, check, '#3DD68C'],
      ['Week One', '7-day streak', true, flame, '#FFB020'],
      ['Two-Week Flame', '14-day streak', true, flame, '#FFB020'],
      ['Scan Master I', '10 Saccade drills', true, scan, '#FFD23F'],

      badges: list.map((b) => ({

</script>
