name: eyeq

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: eyeq/postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eyeq
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eyeq"]
      interval: 2s
      timeout: 3s
      retries: 30

  azurite:
    # Local stand-in for Azure Blob Storage (plan 2.2).
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite:/data

volumes:
  pgdata:
  azurite:
