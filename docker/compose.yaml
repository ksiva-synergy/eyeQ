name: eyeq

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: eyeq/postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eyeq
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eyeq"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
