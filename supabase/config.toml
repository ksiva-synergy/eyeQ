# Supabase CLI config for local development only. Two ways to use it:
#   pnpm db:supabase:up     Postgres alone on port 55322 (parity checks for the db suite)
#   pnpm supabase:up        Postgres + Auth + the Data API gateway, for signing in locally
#                           and for CI's auth end-to-end and anon-key checks
# Run the db scripts with DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres
# Schema changes are db/migrations applied by `pnpm db:migrate`, never `supabase db push`
# or supabase/migrations, so the CLI's own migration and seed steps are off.
# Hosted projects are configured in the dashboard to match (DECISIONS.md, phase 2).
project_id = "eyeq"

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = false

[db.seed]
enabled = false

# EyeQ serves its own API from apps/web. The Data API exposes no EyeQ schema, and the
# anon and authenticated roles hold nothing in public anyway (migrations 0013, 0014).
[api]
enabled = true
port = 54321
schemas = ["graphql_public"]
extra_search_path = ["extensions"]
max_rows = 100
auto_expose_new_tables = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

# Supabase Auth's own limits. Its finest SMS control is a minimum gap per phone
# (max_frequency) plus a project-wide hourly cap; the plan's 5 per phone per hour is
# enforced by apps/web, in the OTP route and again in the Send SMS hook.
[auth.rate_limit]
sms_sent = 100
sign_in_sign_ups = 60
token_verifications = 60
token_refresh = 150

[auth.email]
enable_signup = false

# Phone OTP. Messages go through the Send SMS hook below, never a built-in provider.
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your EyeQ code is {{ .Code }}"
max_frequency = "1s"

# A fixed test number for local runs and CI: no SMS, the code is always 123456.
# Staging uses the dashboard's "Phone numbers for testing" the same way.
[auth.sms.test_otp]
919000000001 = "123456"
919000000002 = "123456"
919000000003 = "123456"

[auth.hook.send_sms]
enabled = true
uri = "http://host.docker.internal:3000/api/auth/sms-hook"
secrets = "env(SEND_SMS_HOOK_SECRET)"

# The CLI enables phone sign-in only when an SMS provider is configured. This one never
# sends: with the Send SMS hook enabled, Supabase Auth hands every code to the hook.
# Placeholder values, local only.
[auth.sms.twilio]
enabled = true
account_sid = "local-placeholder"
message_service_sid = "local-placeholder"
auth_token = "local-placeholder"

[auth.external.google]
enabled = false

[studio]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[local_smtp]
enabled = false
