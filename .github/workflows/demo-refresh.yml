name: Demo refresh (staging)

# `pnpm demo:refresh` against staging, run by hand before a coach demo (Actions › Demo
# refresh (staging) › Run workflow). It retires the demo athletes and lays them down again
# with activity ending yesterday; no ledger row changes (rule 2). The command itself
# refuses any hosted database but the staging project ref (DEMO_PROJECT_REFS in
# packages/db/src/demo-refresh.ts) and anything production. It runs only from main, never
# alongside a migration (same concurrency group as Migrate), and not while a migration is
# pending, since the refresh needs the migrated schema.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "refresh staging demo" to run'
        required: true

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the staging demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    if: github.ref == 'refs/heads/main'
    env:
      # Supabase session pooler or direct host (port 5432) as postgres. Never 6543.
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
      APP_ENV: staging
    steps:
      - name: Confirmed, and the database secret is set
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "refresh staging demo" ]; then
            echo "::error::Type exactly: refresh staging demo"
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::Set the STAGING_DIRECT_URL secret on the staging environment (Settings > Environments > staging)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No migration pending (this workflow never migrates; Migrate does, on merge)
        run: |
          status=$(pnpm --silent --filter @eyeq/db migrate:status)
          echo "$status"
          if echo "$status" | grep -q '^pending'; then
            echo "::error::Staging has pending migrations. Let the Migrate workflow apply them first."
            exit 1
          fi
      - run: pnpm demo:refresh
