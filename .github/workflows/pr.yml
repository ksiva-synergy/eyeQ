name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/eyeq
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Typecheck, lint, unit tests, database tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start Postgres (pg_cron + pgTAP) and Azurite
        run: docker compose -f docker/compose.yaml up -d --wait postgres azurite

      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Migrate, run pgTAP, integration tests, then seed
        run: |
          pnpm db:migrate
          pnpm db:test
          pnpm db:test:integration
          pnpm db:seed

      - name: Build web
        run: pnpm --filter web build

      - name: Build worker
        run: pnpm --filter worker build

      - name: Playwright
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          load: true
          tags: eyeq-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --rm --name eyeq-web -p 3000:3000 eyeq-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; ok=1; break; fi
            sleep 1
          done
          docker logs eyeq-web
          docker stop eyeq-web
          test "$ok" = "1"
