name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/eyeq
  NEXT_TELEMETRY_DISABLED: 1
  # The component gallery is part of phase 3's acceptance run (Playwright).
  DEV_GALLERY: "1"

jobs:
  checks:
    name: Typecheck, lint, unit tests, database tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start Postgres (pg_cron + pgTAP)
        run: docker compose -f docker/compose.yaml up -d --wait postgres

      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Migrate, run pgTAP, integration tests, then seed
        run: |
          pnpm db:migrate
          pnpm db:test
          pnpm db:test:integration
          pnpm db:seed

      - name: Prisma schema matches the migrations
        run: |
          pnpm db:types
          git diff --exit-code packages/db/prisma/schema.prisma

      - name: Build web
        run: pnpm --filter web build

      - name: Playwright
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web test:e2e
        env:
          CI: "true"

      - name: Screenshots match the baselines (browser in the official Playwright image)
        run: cd apps/web && scripts/visual.sh
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  clean-clone:
    name: A fresh clone runs pnpm i && pnpm dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Clone, install, copy .env.example, pnpm dev, request pages
        run: scripts/clean-clone-check.sh "$GITHUB_SHA"

  supabase:
    name: Supabase stack (Postgres, Auth, Data API), sign-in end to end, anon-key lockout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
      APP_ENV: test
      APP_URL: http://localhost:3000
      SMS_PROVIDER: console
      # Test numbers from supabase/config.toml (no SMS; the code is always 123456).
      OTP_TEST_PHONE: "+919000000001"
      OTP_TEST_CODE: "123456"
      OTP_RATE_TEST_PHONE: "+919000000002"
      OTP_HOOK_TEST_PHONE: "+919000000777"
      E2E_AUTH: "1"
      E2E_AUTH_PHONE: "9000000003"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: A throwaway Send SMS hook secret for this run
        run: echo "SEND_SMS_HOOK_SECRET=v1,whsec_$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Start Supabase locally (Postgres, Auth, Data API gateway, Storage)
        run: pnpm supabase:up

      - name: Export the local API URL, anon key and service-role key
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/sb.env"
          set -a; . "$RUNNER_TEMP/sb.env"; set +a
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}" >> "$GITHUB_ENV"
          # Storage uploads (phase 4): the local stack's service-role key, server-only.
          echo "::add-mask::${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}" >> "$GITHUB_ENV"

      - name: Migrate, run pgTAP, integration tests, then seed
        run: |
          pnpm db:migrate
          pnpm db:test
          pnpm db:test:integration
          pnpm db:seed

      - name: Build and start web against local Supabase
        run: |
          pnpm --filter web build
          (cd apps/web && nohup pnpm start > "$RUNNER_TEMP/web.log" 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done

      - name: Sign-in end to end (phone OTP, cookie and bearer sessions, OTP limits, SMS hook)
        run: pnpm --filter web auth:e2e

      - name: Fifty concurrent GET /me (phase 2 acceptance; staging runs the same script)
        run: pnpm --filter web concurrency:check

      - name: The anon key and a signed-in user reach nothing through the Data API
        run: pnpm --filter web check:data-api

      - name: Playwright sign-in in a browser
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web exec playwright test e2e/auth.spec.ts e2e/google.spec.ts
        env:
          CI: "true"
          PW_REUSE_SERVER: "1"

      - name: Phase 5 acceptance (new athlete, seeded Arjun, rule 5) at 390 and 1440
        run: pnpm --filter web exec playwright test e2e/acceptance.spec.ts
        env:
          CI: "true"
          PW_REUSE_SERVER: "1"

      - name: Web server log
        if: always()
        run: cat "$RUNNER_TEMP/web.log" || true
