name: Razorpay plan sync (staging)

# `pnpm razorpay:sync-plans` against staging, run by hand (Actions › Razorpay plan sync
# (staging) › Run workflow), so no laptop holds the database URL or the Razorpay key secret.
# A dry run by default: it lists what it would create or link. With `apply` it creates a
# Razorpay Plan per active subscription product and writes each id to
# products.razorpay_plan_id (one audit_log row each). Idempotent; the script refuses live
# keys (only rzp_test_…). main only, never alongside a migration (Migrate's concurrency group).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create and link the plans (unticked: dry run)"
        type: boolean
        required: true
        default: false

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Razorpay plans for staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    if: github.ref == 'refs/heads/main'
    env:
      # Supabase session pooler or direct host (port 5432) as postgres. Never 6543.
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      APP_ENV: staging
    steps:
      - name: The secrets are set
        run: |
          missing=""
          [ -z "$DIRECT_URL" ] && missing="$missing STAGING_DIRECT_URL"
          [ -z "$RAZORPAY_KEY_ID" ] && missing="$missing RAZORPAY_KEY_ID"
          [ -z "$RAZORPAY_KEY_SECRET" ] && missing="$missing RAZORPAY_KEY_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Set on the staging environment (Settings > Environments > staging):$missing"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dry run
        if: ${{ !inputs.apply }}
        run: pnpm razorpay:sync-plans
      - name: Create and link
        if: ${{ inputs.apply }}
        run: pnpm razorpay:sync-plans --apply
